version: "3.9"

services:
  erp:
    build:
      context: .
      dockerfile: Dockerfile.mock_erp
    container_name: taia_mock_erp
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - taia_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: taia_redis
    ports:
      - "6379:6379"
    networks:
      - taia_network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: taia_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ERP_API_BASE_URL: http://erp:8001/api/v1
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      GUNICORN_WORKERS: "1"
      LOG_LEVEL: INFO
    depends_on:
      - erp
      - redis
    networks:
      - taia_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: taia_flask
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      ERP_API_BASE_URL: http://erp:8001/api/v1
    depends_on:
      erp:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    networks:
      - taia_network

networks:
  taia_network:
    driver: bridge
