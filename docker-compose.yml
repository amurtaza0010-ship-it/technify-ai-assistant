services:
  redis:
    image: redis:7-alpine
    container_name: taia_redis
    ports:
      - "6380:6379"          # external port changed to 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taia_network
    restart: unless-stopped

  erp:
    build:
      context: .
      dockerfile: Dockerfile.mock_erp
    container_name: taia_mock_erp
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - taia_network
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: taia_fastapi
    ports:
      - "8002:8000"               # <-- host port changed to 8002
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      erp:
        condition: service_healthy
    volumes:
      - admin_rag_data:/app/data/admin_rag_store
    networks:
      - taia_network
    restart: unless-stopped

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: taia_flask
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - taia_network
    restart: unless-stopped

networks:
  taia_network:
    driver: bridge

volumes:
  admin_rag_data: